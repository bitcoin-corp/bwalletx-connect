<!-- "Sign in with bWalletX" without JavaScript or a build step. Gold, large. Wire the click yourself. -->
<style>
.bwx-btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:12px;padding:16px 20px;border-radius:12px;cursor:pointer;
 background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#000;font:700 16px/1.2 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 box-shadow:0 10px 15px -3px rgba(245,158,11,.2),0 4px 6px -4px rgba(245,158,11,.2)}
.bwx-btn:hover{background:linear-gradient(180deg,#fde68a,#fbbf24)}
.bwx-btn:active{background:linear-gradient(180deg,#fbbf24,#d97706)}
.bwx-btn:focus-visible{outline:2px solid #b45309;outline-offset:3px}
.bwx-btn:disabled{opacity:.6;cursor:not-allowed}
.bwx-btn .bwx-mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#000;flex:none}
.bwx-btn .bwx-txt{display:flex;flex-direction:column;align-items:flex-start}
.bwx-btn small{font-size:11px;font-weight:500;color:rgba(0,0,0,.65)}
</style>
<button type="button" class="bwx-btn" aria-label="Sign in with bWalletX, also works with bWallet">
  <span class="bwx-mark"><svg viewBox="23 8 74 100" width="15" height="20" aria-hidden="true"><defs><linearGradient id="bwxg" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="105"><stop offset="0" stop-color="#FFE58A"/><stop offset=".55" stop-color="#FFD24D"/><stop offset="1" stop-color="#C98F00"/></linearGradient><mask id="bwxh"><rect width="140" height="140" fill="#fff"/><circle cx="60" cy="72" r="15" fill="#000"/></mask></defs><g fill="url(#bwxg)" mask="url(#bwxh)"><polygon points="45,12 45,76 27,76 27,30"/><circle cx="60" cy="72" r="33"/></g></svg></span>
  <span class="bwx-txt">Sign in with bWalletX<small>also works with bWallet</small></span>
</button>
