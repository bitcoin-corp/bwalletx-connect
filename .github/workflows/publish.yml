# Publish @bwalletx/connect to npm when a version tag (v1.2.3) is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere. One-time setup on
# npmjs.com → @bwalletx/connect → Settings → Trusted publisher → GitHub Actions:
#   organization/user: bitcoin-corp · repository: bwalletx-connect · workflow: publish.yml
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing (and provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }

      - run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      # prepublishOnly runs typecheck, tests and build.
      - run: npm publish --access public
