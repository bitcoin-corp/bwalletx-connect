# Stage @bwalletx/connect on npm when a version tag (v1.2.3) is pushed; a maintainer
# then approves the staged version on npmjs.com.
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere. One-time setup on
# npmjs.com → @bwalletx/connect → Settings → Trusted publisher → GitHub Actions:
#   organization/user: bitcoin-corp · repository: bwalletx-connect · workflow: publish.yml
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing (and provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }

      - run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@12.2.1

      # Staged publishing: the version waits on npmjs.com until a maintainer approves it
      # there (passkey). prepublishOnly runs typecheck, tests and build first.
      - run: npm stage publish --access public
